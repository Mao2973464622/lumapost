# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Docker Compose for LumaPost (v10.6.0)
#  Web UI 已移除：本容器只跑常驻调度器，不暴露任何端口。
#
#  启动:      docker compose up -d
#  看状态:    docker compose exec lumapost node scripts/cli.js status
#  立刻发一份: docker compose run --rm lumapost run morning
#  看日志:    docker compose logs -f
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
services:
  lumapost:
    build: .
    image: lumapost:latest
    container_name: lumapost
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    command: ["serve"]
    healthcheck:
      test: ["CMD", "node", "-e", "const c=require('./scripts/config-store');process.exit(c.validate().valid?0:1)"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 30s