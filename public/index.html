<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080B16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark light">
<title>LumaPost · 光影邮报</title>
<style>
/* ============================================================
   LumaPost Design System v5.1 — No-Emoji / SVG Icon edition
   ============================================================ */
:root{
  --brand-1:#6366F1; --brand-2:#8B5CF6; --brand-3:#22D3EE;
  --grad-brand:linear-gradient(135deg,#6366F1 0%,#8B5CF6 55%,#A855F7 100%);
  --grad-glow:linear-gradient(135deg,rgba(99,102,241,.22),rgba(168,85,247,.10));
  --brand-soft:rgba(99,102,241,.14);
  --brand-line:rgba(99,102,241,.32);
  --ok:#10B981;   --ok-soft:rgba(16,185,129,.14);
  --warn:#F59E0B; --warn-soft:rgba(245,158,11,.14);
  --err:#F43F5E;  --err-soft:rgba(244,63,94,.14);
  --info:#38BDF8; --info-soft:rgba(56,189,248,.14);
  --bg:#080B16;
  --surface:#111726; --surface-2:#182031; --surface-3:#1F2A3D; --input:#0C1220;
  --line:rgba(255,255,255,.075); --line-strong:rgba(255,255,255,.14);
  --text:#EEF2F9; --text-2:#A7B3C9; --text-3:#6B7893;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:26px; --r-full:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px; --s-10:40px;
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 4px 16px rgba(0,0,0,.34);
  --sh-3:0 12px 36px rgba(0,0,0,.42);
  --sh-brand:0 8px 26px rgba(99,102,241,.34);
  --ease:cubic-bezier(.32,.72,0,1);
  --fast:150ms; --mid:240ms; --slow:380ms;
  --sidebar-w:248px; --topbar-h:60px; --tabbar-h:64px; --maxw:1080px;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#F5F7FC; --surface:#FFFFFF; --surface-2:#F4F6FB; --surface-3:#EEF1F8; --input:#F2F5FA;
    --line:rgba(15,23,42,.08); --line-strong:rgba(15,23,42,.16);
    --text:#0D1424; --text-2:#5A6780; --text-3:#8A94A8;
    --brand-soft:rgba(79,70,229,.10); --brand-line:rgba(79,70,229,.26);
    --sh-1:0 1px 2px rgba(15,23,42,.06);
    --sh-2:0 6px 20px rgba(15,23,42,.08);
    --sh-3:0 16px 40px rgba(15,23,42,.12);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:-20% -10% auto -10%;height:66vh;z-index:-1;pointer-events:none;
  background:
    radial-gradient(46% 52% at 18% 8%,rgba(99,102,241,.17),transparent 70%),
    radial-gradient(42% 46% at 86% 0%,rgba(34,211,238,.10),transparent 68%);
  filter:blur(6px);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9px}
::selection{background:var(--brand-soft)}

/* ---------- SVG icon base ---------- */
.ic{
  width:1em;height:1em;display:inline-block;vertical-align:-0.145em;
  fill:currentColor;flex:0 0 auto;overflow:hidden;
}
.ic-l{width:1.15em;height:1.15em}
.ic-xl{width:1.7em;height:1.7em}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100dvh}
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);z-index:40;
  display:flex;flex-direction:column;padding:var(--s-5) var(--s-3);
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  border-right:1px solid var(--line);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
}
.brand{display:flex;align-items:center;gap:var(--s-3);padding:0 var(--s-2) var(--s-5)}
.brand-logo{
  width:40px;height:40px;flex:0 0 40px;border-radius:13px;background:var(--grad-brand);
  display:grid;place-items:center;color:#fff;font-size:19px;box-shadow:var(--sh-brand);
}
.brand-name{font-size:15.5px;font-weight:760;letter-spacing:.2px;line-height:1.25}
.brand-sub{font-size:10.5px;color:var(--text-3);letter-spacing:.7px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;padding-bottom:var(--s-3)}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--text-3);padding:var(--s-3) var(--s-3) var(--s-2)}
.nav-item{
  display:flex;align-items:center;gap:var(--s-3);padding:10px var(--s-3);
  border-radius:var(--r-sm);color:var(--text-2);font-size:14px;font-weight:560;
  text-align:left;width:100%;position:relative;
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease),transform var(--fast) var(--ease);
}
.nav-item .ic{width:18px;height:18px;opacity:.82}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item:active{transform:scale(.985)}
.nav-item.active{background:var(--brand-soft);color:var(--text);font-weight:660}
.nav-item.active .ic{opacity:1;color:var(--brand-1)}
.nav-item.active::before{
  content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--grad-brand);
}
.sidebar-foot{padding:var(--s-3) var(--s-2) 0;border-top:1px solid var(--line)}
.sidebar-foot .btn{width:100%}

.topbar{
  display:none;position:sticky;top:0;z-index:35;height:var(--topbar-h);
  align-items:center;justify-content:space-between;gap:var(--s-3);padding:0 var(--s-4);
  background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid var(--line);
}
.topbar .brand{padding:0;gap:var(--s-2)}
.topbar .brand-logo{width:32px;height:32px;flex-basis:32px;border-radius:10px;font-size:15px}
.topbar .brand-name{font-size:14.5px}
.topbar-actions{display:flex;gap:var(--s-2)}
.icon-btn{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:16px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);
  transition:transform var(--fast) var(--ease),background var(--fast) var(--ease),color var(--fast) var(--ease);
}
.icon-btn:active{transform:scale(.92);background:var(--surface-3);color:var(--text)}

.main{flex:1;margin-left:var(--sidebar-w);padding:var(--s-6) var(--s-6) var(--s-10);width:100%;min-width:0}
.wrap{max-width:var(--maxw);margin:0 auto;width:100%}

.tabbar{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:38;
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(22px) saturate(170%);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  border-top:1px solid var(--line);
}
.tabbar-inner{display:flex;height:var(--tabbar-h)}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--text-3);font-size:10.5px;font-weight:620;position:relative;
  transition:color var(--fast) var(--ease);
}
.tab-item .ic{width:20px;height:20px;transition:transform var(--mid) var(--ease)}
.tab-item:active .ic{transform:scale(.86)}
.tab-item.active{color:var(--brand-1)}
.tab-item.active::after{content:'';position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--grad-brand)}
@media (prefers-color-scheme:light){.tab-item.active{color:#4F46E5}}

/* ---------- Components ---------- */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s-4);margin-bottom:var(--s-5);flex-wrap:wrap}
.page-title{font-size:25px;font-weight:800;letter-spacing:-.4px;line-height:1.25}
.page-desc{font-size:13px;color:var(--text-3);margin-top:3px}
.page-head-actions{display:flex;gap:var(--s-2);flex-wrap:wrap}

.section{margin-bottom:var(--s-6)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);margin-bottom:var(--s-3)}
.section-title{font-size:13px;font-weight:720;color:var(--text-2);display:flex;align-items:center;gap:8px}
.section-title .ic{width:15px;height:15px;color:var(--text-3)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:42px;padding:0 var(--s-4);border-radius:var(--r-sm);
  font-size:14px;font-weight:660;white-space:nowrap;border:1px solid transparent;
  user-select:none;
  transition:transform var(--fast) var(--ease),background var(--fast) var(--ease),box-shadow var(--fast) var(--ease),border-color var(--fast) var(--ease),opacity var(--fast),filter var(--fast);
}
.btn .ic{width:16px;height:16px}
.btn:active{transform:scale(.972)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-primary{background:var(--grad-brand);color:#fff;box-shadow:var(--sh-brand)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-secondary{background:var(--surface-2);color:var(--text);border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--surface-3)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--err-soft);color:var(--err);border-color:rgba(244,63,94,.28)}
.btn-sm{height:34px;padding:0 var(--s-3);font-size:12.5px;border-radius:var(--r-xs);gap:5px}
.btn-sm .ic{width:14px;height:14px}
.btn-lg{height:48px;padding:0 var(--s-5);font-size:15px}
.btn-block{width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-1);overflow:hidden}
.card-pad{padding:var(--s-5)}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--line)}
.card-hd-title{font-size:14px;font-weight:700}
.card-bd{padding:var(--s-5)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s-3)}
.stat{
  position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);padding:var(--s-4);box-shadow:var(--sh-1);
  transition:transform var(--mid) var(--ease),box-shadow var(--mid) var(--ease),border-color var(--mid) var(--ease);
}
.stat::after{content:'';position:absolute;right:-28px;top:-28px;width:88px;height:88px;border-radius:50%;background:var(--grad-glow);pointer-events:none}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--line-strong)}
.stat-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);margin-bottom:var(--s-3);color:var(--text-2)}
.stat-ico .ic{width:18px;height:18px}
.stat-ico.brand{background:var(--brand-soft);color:var(--brand-1)}
.stat-ico.ok{background:var(--ok-soft);color:var(--ok)}
.stat-ico.warn{background:var(--warn-soft);color:var(--warn)}
.stat-ico.info{background:var(--info-soft);color:var(--info)}
.stat-val{font-size:19px;font-weight:790;letter-spacing:-.5px;line-height:1.2;word-break:break-word}
.stat-label{font-size:11.5px;color:var(--text-3);margin-top:3px;font-weight:560}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4)}
.field{margin-bottom:var(--s-4)}
.field:last-child{margin-bottom:0}
.label{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2);font-size:12.5px;font-weight:650;color:var(--text-2);margin-bottom:7px}
.label-hint{font-size:11px;font-weight:500;color:var(--text-3)}
.input,.select{
  width:100%;height:44px;padding:0 var(--s-3);background:var(--input);
  border:1px solid var(--line-strong);border-radius:var(--r-sm);color:var(--text);
  font-size:14px;outline:none;appearance:none;
  transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease),background var(--fast);
}
textarea.input{height:auto;min-height:84px;padding:11px var(--s-3);resize:vertical;line-height:1.55}
.input::placeholder{color:var(--text-3)}
.input:focus,.select:focus{border-color:var(--brand-1);box-shadow:0 0 0 3.5px var(--brand-soft);background:var(--surface)}
.select{
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath fill='%238A94A8' d='M5 6 0 0h10z'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:36px;
}
.input-wrap{position:relative}
.input-wrap .input{padding-right:46px}
.input-eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:15px;color:var(--text-3);transition:background var(--fast),color var(--fast)}
.input-eye:hover{background:var(--surface-2);color:var(--text)}
.input-eye.on{color:var(--brand-1)}

.range{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:var(--surface-3);outline:none;margin:12px 0 2px}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--grad-brand);border:2.5px solid var(--surface);box-shadow:0 2px 8px rgba(99,102,241,.5);cursor:pointer;transition:transform var(--fast) var(--ease)}
.range::-webkit-slider-thumb:active{transform:scale(1.15)}
.range-val{font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--brand-1);background:var(--brand-soft);padding:1px 8px;border-radius:var(--r-full)}
.range-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:4px}

.badge{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;border-radius:var(--r-full);font-size:11px;font-weight:700;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.badge .ic{width:11px;height:11px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.err{background:var(--err-soft);color:var(--err)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.brand{background:var(--brand-soft);color:var(--brand-1)}

.chips{display:flex;gap:var(--s-2);flex-wrap:wrap}
.chip{height:32px;padding:0 13px;border-radius:var(--r-full);background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:620;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,Menlo,monospace;transition:all var(--fast) var(--ease)}
.chip:hover{border-color:var(--line-strong);color:var(--text)}
.chip.active{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-1)}

.provider-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:var(--s-3)}
.provider{position:relative;text-align:left;padding:var(--s-4);border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);overflow:hidden;transition:all var(--mid) var(--ease)}
.provider:hover{transform:translateY(-2px);border-color:var(--line-strong);box-shadow:var(--sh-2)}
.provider:active{transform:scale(.98)}
.provider.active{border-color:var(--brand-1);background:var(--brand-soft);box-shadow:0 0 0 3px var(--brand-soft)}
.provider-check{position:absolute;top:9px;right:10px;width:19px;height:19px;border-radius:50%;background:var(--grad-brand);color:#fff;display:none;place-items:center}
.provider-check .ic{width:11px;height:11px}
.provider.active .provider-check{display:grid}
.provider-av{width:34px;height:34px;border-radius:10px;margin-bottom:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2)}
.provider-av .ic{width:17px;height:17px}
.provider.active .provider-av{background:var(--grad-brand);color:#fff}
.provider-name{font-size:13.5px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.provider-model{font-size:11px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Menlo,monospace}

.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:var(--s-3);padding:13px var(--s-5);border-bottom:1px solid var(--line);text-align:left;width:100%;transition:background var(--fast) var(--ease)}
.list-item:last-child{border-bottom:0}
.list-item.clickable{cursor:pointer}
.list-item:hover{background:var(--surface-2)}
.list-item.clickable:active{background:var(--surface-3)}
.li-main{flex:1;min-width:0}
.li-title{font-size:13.5px;font-weight:620;line-height:1.45}
.li-meta{font-size:11.5px;color:var(--text-3);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.li-av{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-3);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.li-av .ic{width:16px;height:16px}
.li-radio{width:19px;height:19px;border-radius:50%;flex:0 0 19px;border:2px solid var(--line-strong);position:relative;transition:all var(--fast) var(--ease)}
.list-item.selected{background:var(--brand-soft)}
.list-item.selected .li-radio{border-color:var(--brand-1);background:var(--brand-1)}
.list-item.selected .li-radio::after{content:'';position:absolute;inset:3.5px;border-radius:50%;background:#fff}

.banner{display:flex;align-items:flex-start;gap:var(--s-3);padding:var(--s-4);border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface)}
.banner.ok{background:var(--ok-soft);border-color:rgba(16,185,129,.28)}
.banner.warn{background:var(--warn-soft);border-color:rgba(245,158,11,.28)}
.banner.err{background:var(--err-soft);border-color:rgba(244,63,94,.28)}
.banner-ico{width:22px;height:22px;display:grid;place-items:center;flex:0 0 22px;margin-top:1px}
.banner-ico .ic{width:18px;height:18px}
.banner.ok .banner-ico{color:var(--ok)}
.banner.warn .banner-ico{color:var(--warn)}
.banner.err .banner-ico{color:var(--err)}
.banner-title{font-size:13.5px;font-weight:700;margin-bottom:1px}
.banner-desc{font-size:12px;color:var(--text-2);line-height:1.55}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-2);padding:var(--s-8) var(--s-5);text-align:center}
.empty-ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);margin-bottom:var(--s-2);color:var(--text-3)}
.empty-ico .ic{width:26px;height:26px}
.empty-title{font-size:14px;font-weight:680}
.empty-desc{font-size:12.5px;color:var(--text-3);max-width:280px;line-height:1.55}

.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:shimmer 1.35s ease-in-out infinite;border-radius:var(--r-xs)}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.sk-line{height:12px;margin-bottom:8px}
.sk-line.w60{width:60%}

.toasts{position:fixed;right:var(--s-5);bottom:calc(var(--s-5) + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;gap:var(--s-2);pointer-events:none;max-width:min(340px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:12px var(--s-4);border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line-strong);box-shadow:var(--sh-3);font-size:13px;font-weight:600;pointer-events:auto;animation:toastIn var(--slow) var(--ease) both}
.toast .ic{width:16px;height:16px}
.toast.out{animation:toastOut var(--mid) var(--ease) both}
.toast.ok{border-color:rgba(16,185,129,.4)}
.toast.ok .ic{color:var(--ok)}
.toast.err{border-color:rgba(244,63,94,.4)}
.toast.err .ic{color:var(--err)}
.toast.info .ic{color:var(--info)}
.toast.warn .ic{color:var(--warn)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px) scale(.94)}}

.loading-bar{position:fixed;top:0;left:0;right:0;height:2.5px;z-index:95;overflow:hidden;opacity:0;transition:opacity var(--fast)}
.loading-bar.on{opacity:1}
.loading-bar::after{content:'';position:absolute;inset:0;width:38%;background:var(--grad-brand);border-radius:9px;animation:barSlide 1.05s var(--ease) infinite}
@keyframes barSlide{0%{transform:translateX(-105%)}100%{transform:translateX(300%)}}

.modal-mask{position:fixed;inset:0;z-index:80;background:rgba(4,6,14,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:var(--s-5);animation:fadeIn var(--mid) var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:var(--sh-3);overflow:hidden;animation:modalIn var(--slow) var(--ease)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.modal-hd{padding:var(--s-5) var(--s-5) var(--s-2)}
.modal-title{font-size:16px;font-weight:760}
.modal-desc{font-size:12.5px;color:var(--text-3);margin-top:4px;line-height:1.55}
.modal-ft{display:flex;gap:var(--s-2);padding:var(--s-4) var(--s-5) var(--s-5)}
.modal-ft .btn{flex:1}

.preview-frame{width:100%;height:min(72vh,760px);border:0;background:#fff;border-radius:var(--r-md);display:block}
.preview-shell{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s-2);box-shadow:var(--sh-1)}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{height:32px;padding:0 14px;border-radius:9px;font-size:12.5px;font-weight:640;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;transition:all var(--fast) var(--ease)}
.seg button .ic{width:14px;height:14px}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:var(--sh-1)}
@media (prefers-color-scheme:light){.seg button.active{box-shadow:0 1px 3px rgba(15,23,42,.12)}}

.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:var(--s-6);margin-bottom:var(--s-5);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-2)}
.hero::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 130% at 100% 0%,rgba(139,92,246,.20),transparent 62%),radial-gradient(70% 120% at 0% 100%,rgba(34,211,238,.13),transparent 60%)}
.hero-in{position:relative;display:flex;align-items:center;justify-content:space-between;gap:var(--s-5);flex-wrap:wrap}
.hero-title{font-size:22px;font-weight:820;letter-spacing:-.5px;line-height:1.3}
.hero-title .grad{background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:13px;color:var(--text-2);margin-top:6px;max-width:430px;line-height:1.6}
.hero-actions{display:flex;gap:var(--s-2);flex-wrap:wrap}
.hero-pulse{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:4px 10px;border-radius:var(--r-full);margin-bottom:var(--s-3)}
.hero-pulse.ok{color:var(--ok);background:var(--ok-soft)}
.hero-pulse.warn{color:var(--warn);background:var(--warn-soft)}
.hero-pulse i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.8s ease-in-out infinite;display:block}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

.sticky-actions{position:sticky;bottom:0;z-index:20;display:flex;gap:var(--s-2);padding:var(--s-3) 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.sticky-actions .btn{flex:1}

.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.muted{color:var(--text-3)}
.mt-3{margin-top:var(--s-3)}
.mt-4{margin-top:var(--s-4)}
.hidden{display:none !important}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .main{margin-left:0;padding:0 var(--s-4) calc(var(--tabbar-h) + var(--s-6))}
  .sidebar{display:none}
  .topbar{display:flex}
  .tabbar{display:block}
  .page-title{font-size:21px}
  .hero{padding:var(--s-5);border-radius:var(--r-md)}
  .hero-title{font-size:19px}
  .stats{grid-template-columns:repeat(2,1fr);gap:var(--s-2)}
  .stat{padding:var(--s-3)}
  .stat-val{font-size:16.5px}
  .provider-grid{grid-template-columns:repeat(2,1fr);gap:var(--s-2)}
  .provider{padding:var(--s-3)}
  .form-row{grid-template-columns:1fr;gap:0}
  .toasts{left:var(--s-4);right:var(--s-4);bottom:calc(var(--tabbar-h) + var(--s-3) + env(safe-area-inset-bottom));max-width:none}
  .preview-frame{height:min(66vh,600px)}
  .hero-in{gap:var(--s-4)}
  .hero-actions{width:100%}
  .hero-actions .btn{flex:1}
  .list-item{padding:12px var(--s-4)}
}
@media (max-width:420px){
  .page-head-actions{width:100%}
  .page-head-actions .btn{flex:1}
  .btn{padding:0 var(--s-3)}
  .seg{width:100%}
  .seg button{flex:1;justify-content:center}
}
</style>

<nav class="tabbar"><div class="tabbar-inner" id="tabBar"></div></nav>
<div class="toasts" id="toasts"></div>

<script>
/* ===========================================================
   LumaPost Web UI v5.1 — App Logic (SVG icon edition)
   =========================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '"', "'": '&#39;' }[c]));
const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

const State = {
  page: 'dashboard',
  config: {},
  providers: [],
  models: [],
  previewPeriod: 'morning',
  history: { fetchHistory: [], sendHistory: [] },
  loading: 0,
};

const API = {
  async req(path, opt = {}) {
    const res = await fetch(path, {
      headers: opt.body ? { 'Content-Type': 'application/json' } : undefined,
      ...opt,
    });
    const text = await res.text();
    let data;
    try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
    if (!res.ok) throw new Error(data.error || data.message || `HTTP ${res.status}`);
    return data;
  },
  get: (p) => API.req(p),
  post: (p, b) => API.req(p, { method: 'POST', body: JSON.stringify(b ?? {}) }),
  del: (p) => API.req(p, { method: 'DELETE' }),
};

/* ---------- Feedback ---------- */
const TOAST_ICON = { ok: 'check-circle', err: 'close', info: 'plus-info', warn: 'warning' };
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${ic(TOAST_ICON[type] || 'plus-info')}<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  const t = setTimeout(dismiss, 3200);
  function dismiss() { clearTimeout(t); el.classList.add('out'); setTimeout(() => el.remove(), 260); }
  el.addEventListener('click', dismiss);
}
function busy(on) {
  State.loading = Math.max(0, State.loading + (on ? 1 : -1));
  $('#loadingBar').classList.toggle('on', State.loading > 0);
}
const buzz = () => { try { navigator.vibrate?.(8); } catch {} };

function skeleton(rows = 4) {
  return `<div class="card card-bd">${Array.from({ length: rows }, (_, i) =>
    `<div class="sk sk-line ${i % 2 ? 'w60' : ''}"></div>`).join('')}</div>`;
}
function emptyState(icon, title, desc, actionHtml = '') {
  return `<div class="empty">
    <div class="empty-ico">${ic(icon)}</div>
    <div class="empty-title">${esc(title)}</div>
    <div class="empty-desc">${esc(desc)}</div>
    ${actionHtml ? `<div class="mt-3">${actionHtml}</div>` : ''}
  </div>`;
}

/* ---------- Navigation ---------- */
const NAV = [
  { key: 'dashboard', label: '仪表盘', icon: 'dashboard' },
  { key: 'config', label: '配置', icon: 'settings' },
  { key: 'providers', label: '提供商', icon: 'cpu' },
  { key: 'history', label: '历史', icon: 'history' },
  { key: 'preview', label: '预览', icon: 'eye' },
];

function renderNav() {
  $('#sideNav').innerHTML = `<div class="nav-label">导航</div>` +
    NAV.map(n => `<button class="nav-item ${State.page === n.key ? 'active' : ''}" data-nav="${n.key}">
      ${ic(n.icon)}<span>${n.label}</span></button>`).join('');
  $('#tabBar').innerHTML = NAV.map(n => `<button class="tab-item ${State.page === n.key ? 'active' : ''}" data-nav="${n.key}">
      ${ic(n.icon)}<span>${n.label}</span></button>`).join('');
}

function go(page) {
  if (State.page === page) return;
  State.page = page;
  renderNav();
  render();
  window.scrollTo(0, 0);
}

/* ---------- Router ---------- */
async function render() {
  const view = $('#view');
  view.innerHTML = skeleton(5);
  const fn = { dashboard: pageDashboard, config: pageConfig, providers: pageProviders, history: pageHistory, preview: pagePreview }[State.page];
  try {
    view.innerHTML = await fn();
    bind();
  } catch (e) {
    view.innerHTML = `<div class="card">${emptyState('warning', '加载失败', e.message,
      `<button class="btn btn-secondary btn-sm" data-act="reload">${ic('refresh')}重试</button>`)}</div>`;
    bind();
    toast('加载失败: ' + e.message, 'err');
  }
}

/* ---------- Page helpers ---------- */
function pageHead(title, desc, actions = '') {
  return `<div class="page-head">
    <div><div class="page-title">${esc(title)}</div><div class="page-desc">${esc(desc)}</div></div>
    ${actions ? `<div class="page-head-actions">${actions}</div>` : ''}
  </div>`;
}
function section(title, body, icon = '', right = '') {
  return `<div class="section">
    <div class="section-head">
      <div class="section-title">${icon ? ic(icon) : ''}${esc(title)}</div>
      ${right}
    </div>${body}</div>`;
}

/* ============ Dashboard ============ */
async function pageDashboard() {
  const [val, news] = await Promise.all([
    API.get('/api/config/validate').catch(() => ({ valid: false, errors: ['无法校验'] })),
    API.get('/api/news/latest').catch(() => ({ headline: [] })),
  ]);
  const c = State.config;
  const enabled = c.sections?.enabled?.length || 0;
  const headlines = news.headline || [];
  const stat = (icon, cls, val, label) =>
    `<div class="stat"><div class="stat-ico ${cls}">${ic(icon)}</div>
      <div class="stat-val">${esc(val)}</div><div class="stat-label">${esc(label)}</div></div>`;

  const hero = `<div class="hero"><div class="hero-in">
    <div>
      <div class="hero-pulse ${val.valid ? 'ok' : 'warn'}"><i></i>${val.valid ? '系统运行正常' : '配置待完善'}</div>
      <div class="hero-title">欢迎回到 <span class="grad">LumaPost</span> 光影邮报</div>
      <div class="hero-sub">AI 驱动的智能新闻邮件系统，每日四次自动推送，多提供商自由切换。</div>
    </div>
    <div class="hero-actions">
      <button class="btn btn-primary btn-lg" data-act="fetch">${ic('rocket')}立即抓取</button>
      <button class="btn btn-secondary btn-lg" data-act="nav" data-to="preview">${ic('eye')}预览邮件</button>
    </div>
  </div></div>`;

  const banner = val.valid
    ? `<div class="banner ok"><div class="banner-ico">${ic('check-circle')}</div><div>
        <div class="banner-title">配置完整可用</div>
        <div class="banner-desc">AI 与邮件服务均已配置，可以正常执行抓取与发送任务。</div></div></div>`
    : `<div class="banner warn"><div class="banner-ico">${ic('warning')}</div><div>
        <div class="banner-title">配置不完整</div>
        <div class="banner-desc">${esc((val.errors || []).join(' · ') || '请前往配置页面补全信息')}</div>
        <div class="mt-3"><button class="btn btn-sm btn-secondary" data-act="nav" data-to="config">前往配置${ic('arrow-right')}</button></div></div></div>`;

  const newsList = headlines.length
    ? `<div class="card"><div class="list">${headlines.slice(0, 5).map((h, i) => `
        <div class="list-item">
          <div class="li-av">${String(i + 1).padStart(2, '0')}</div>
          <div class="li-main">
            <div class="li-title">${esc(h.title || '无标题')}</div>
            <div class="li-meta"><span>${esc(h.source || '综合')}</span>
              ${h.verified ? `<span class="badge ok">${ic('check')}已核实</span>` : ''}</div>
          </div>
        </div>`).join('')}</div></div>`
    : `<div class="card">${emptyState('newspaper', '暂无新闻数据', '点击「立即抓取」开始第一次新闻采集，或先完成配置。',
        `<button class="btn btn-primary btn-sm" data-act="fetch">${ic('rocket')}开始抓取</button>`)}</div>`;

  return pageHead('仪表盘', '系统概览与运行状态',
    `<button class="btn btn-secondary btn-sm" data-act="reload">${ic('refresh')}刷新</button>`) + hero +
    `<div class="stats" style="margin-bottom:var(--s-5)">
      ${stat('cpu', 'brand', c.ai?.provider || '未设置', 'AI 提供商')}
      ${stat('mail', 'ok', c.mail?.provider || '未设置', '邮件服务')}
      ${stat('clock', 'warn', c.schedule?.morning || '06:00', '早报时间')}
      ${stat('list', 'info', enabled + ' 个', '新闻版块')}
    </div>` +
    section('系统状态', banner, 'stethoscope') +
    section('最新头条', newsList, 'newspaper',
      `<button class="btn btn-ghost btn-sm" data-act="nav" data-to="history">全部${ic('arrow-right')}</button>`);
}

/* ============ Config ============ */
const AI_FALLBACK = ['deepseek', 'openai', 'anthropic', 'google', 'qwen', 'kimi', 'doubao', 'zhipu', 'xai'];
const MAIL_MAP = { qq: 'QQ 邮箱', netease: '网易 163', gmail: 'Gmail', outlook: 'Outlook' };
const PROVIDER_ICON = { deepseek: 'cpu', openai: 'bolt', anthropic: 'puzzle', google: 'globe', qwen: 'code', kimi: 'moon', doubao: 'package', zhipu: 'code', xai: 'bolt' };

function opt(val, label, cur) {
  return `<option value="${esc(val)}"${cur === val ? ' selected' : ''}>${esc(label)}</option>`;
}

async function pageConfig() {
  if (!State.providers.length) {
    try { State.providers = (await API.get('/api/providers')).providers || []; } catch { State.providers = []; }
  }
  const c = State.config;
  const aiNames = State.providers.length
    ? State.providers.map(p => ({ k: p.key, n: p.name || p.key }))
    : AI_FALLBACK.map(k => ({ k, n: k }));

  const aiCard = `<div class="card"><div class="card-bd">
    <div class="field">
      <label class="label">AI 提供商 <span class="label-hint">支持自动拉取模型</span></label>
      <select class="select" id="f-ai-provider">
        ${aiNames.map(p => opt(p.k, p.n, c.ai?.provider)).join('')}
      </select>
    </div>
    <div class="field">
      <label class="label">API Key</label>
      <div class="input-wrap">
        <input class="input" id="f-ai-key" type="password" value="${esc(c.ai?.apiKey || '')}" placeholder="sk-..." autocomplete="off" spellcheck="false">
        <button class="input-eye" data-act="eye" data-target="f-ai-key" type="button" aria-label="显示或隐藏密钥">${ic('eye')}</button>
      </div>
    </div>
    <div class="field">
      <label class="label">模型 <span class="label-hint">留空使用默认</span></label>
      <div style="display:flex;gap:8px">
        <input class="input" id="f-ai-model" value="${esc(c.ai?.model || '')}" placeholder="默认模型">
        <button class="btn btn-secondary" data-act="loadmodels" type="button" style="flex:0 0 auto">${ic('refresh')}拉取</button>
      </div>
      <div class="chips mt-3" id="modelChips"></div>
    </div>
    <div class="field">
      <label class="label">Temperature <span class="range-val" id="tempVal">${c.ai?.temperature ?? 0.7}</span></label>
      <input class="range" id="f-ai-temp" type="range" min="0" max="2" step="0.1" value="${c.ai?.temperature ?? 0.7}">
      <div class="range-legend"><span>精确 0</span><span>均衡 1</span><span>创造 2</span></div>
    </div>
  </div></div>`;

  const mailCard = `<div class="card"><div class="card-bd">
    <div class="field">
      <label class="label">邮件服务商</label>
      <select class="select" id="f-mail-provider">
        ${Object.keys(MAIL_MAP).map(k => opt(k, MAIL_MAP[k], c.mail?.provider)).join('')}
      </select>
    </div>
    <div class="field">
      <label class="label">发件邮箱</label>
      <input class="input" id="f-mail-user" type="email" value="${esc(c.mail?.user || '')}" placeholder="you@example.com" autocomplete="off">
    </div>
    <div class="field">
      <label class="label">授权码 / 密码</label>
      <div class="input-wrap">
        <input class="input" id="f-mail-pass" type="password" value="${esc(c.mail?.pass || '')}" placeholder="SMTP 授权码" autocomplete="off">
        <button class="input-eye" data-act="eye" data-target="f-mail-pass" type="button" aria-label="显示或隐藏密码">${ic('eye')}</button>
      </div>
    </div>
    <div class="field">
      <label class="label">收件邮箱 <span class="label-hint">留空则发给自己</span></label>
      <input class="input" id="f-mail-to" type="email" value="${esc(c.mail?.to || '')}" placeholder="可选">
    </div>
  </div></div>`;

  const times = [['morning', '早报', 'sunrise'], ['noon', '午报', 'sun'], ['afternoon', '午后', 'sunset'], ['evening', '晚间', 'moon']];
  const schCard = `<div class="card"><div class="card-bd">
    <div class="form-row">
      ${times.map(([k, l, i]) => `<div class="field">
        <label class="label">${ic(i)}${l}</label>
        <input class="input" id="f-sch-${k}" type="time" value="${esc(c.schedule?.[k] || '')}">
      </div>`).join('')}
    </div>
  </div></div>`;

  return pageHead('配置', 'AI、邮件与定时任务设置') +
    section('AI 设置', aiCard, 'cpu') +
    section('邮件设置', mailCard, 'mail') +
    section('定时任务', schCard, 'clock') +
    `<div class="sticky-actions">
      <button class="btn btn-primary" data-act="save">${ic('save')}保存配置</button>
      <button class="btn btn-secondary" data-act="test-ai">${ic('flask')}测试 AI</button>
      <button class="btn btn-secondary" data-act="test-mail">${ic('mail')}测试邮件</button>
    </div>`;
}

function collectConfig() {
  const g = (id) => $('#' + id)?.value?.trim?.() ?? '';
  return {
    ai: {
      provider: g('f-ai-provider'),
      apiKey: g('f-ai-key'),
      model: g('f-ai-model'),
      temperature: parseFloat($('#f-ai-temp')?.value || '0.7'),
    },
    mail: { provider: g('f-mail-provider'), user: g('f-mail-user'), pass: g('f-mail-pass'), to: g('f-mail-to') },
    schedule: {
      morning: g('f-sch-morning'), noon: g('f-sch-noon'),
      afternoon: g('f-sch-afternoon'), evening: g('f-sch-evening'),
    },
  };
}

/* ============ Providers ============ */
async function pageProviders() {
  const res = await API.get('/api/providers');
  State.providers = res.providers || [];
  const cur = State.config.ai?.provider;
  const grid = State.providers.length
    ? `<div class="provider-grid">${State.providers.map(p => `
        <button class="provider ${cur === p.key ? 'active' : ''}" data-pick="${esc(p.key)}">
          <span class="provider-check">${ic('check')}</span>
          <div class="provider-av">${ic(PROVIDER_ICON[p.key] || 'cpu')}</div>
          <div class="provider-name">${esc(p.name || p.key)}</div>
          <div class="provider-model">${esc(p.defaultModel || '默认模型')}</div>
        </button>`).join('')}</div>`
    : `<div class="card">${emptyState('cpu', '没有可用提供商', '请检查后端 providers 配置。')}</div>`;

  return pageHead('AI 提供商', `共 ${State.providers.length} 家，点击选择后自动拉取模型`,
    `<button class="btn btn-secondary btn-sm" data-act="nav" data-to="config">前往配置${ic('arrow-right')}</button>`) +
    section('选择提供商', grid, 'puzzle') +
    section('可用模型',
      `<div class="card" id="modelBox">${emptyState('list', '尚未选择提供商', '在上方点选一个提供商，即可加载模型列表。')}</div>`,
      'package', `<span class="badge brand hidden" id="modelCount"></span>`);
}

async function loadModels(providerKey) {
  const box = $('#modelBox');
  if (!box) return;
  box.innerHTML = `<div class="card-bd">${Array.from({ length: 4 }, () => '<div class="sk sk-line"></div>').join('')}</div>`;
  try {
    busy(true);
    const res = await API.get(`/api/models/${encodeURIComponent(providerKey)}`);
    busy(false);
    State.models = res.models || [];
    if (!State.models.length) {
      box.innerHTML = emptyState('empty-box', '暂无模型', '该提供商可能需要先填写有效 API Key，或接口不支持列出模型。');
      return;
    }
    const cur = State.config.ai?.model;
    box.innerHTML = `<div class="list">${State.models.map(m => {
      const id = m.id || m.name;
      const active = cur === id;
      return `<button class="list-item clickable ${active ? 'selected' : ''}" data-model="${esc(id)}">
        <div class="li-main">
          <div class="li-title mono">${esc(id)}</div>
          <div class="li-meta">${m.name && m.name !== id ? `<span>${esc(m.name)}</span>` : ''}
            ${m.context ? `<span>上下文 ${esc(m.context)}</span>` : ''}</div>
        </div>
        <span class="li-radio"></span>
      </button>`;
    }).join('')}</div>`;
    const badge = $('#modelCount');
    if (badge) { badge.classList.remove('hidden'); badge.textContent = `${State.models.length} 个模型`; }
  } catch (e) {
    busy(false);
    box.innerHTML = emptyState('warning', '模型加载失败', e.message);
  }
}

function renderModelChips() {
  const wrap = $('#modelChips');
  if (!wrap || !State.models.length) return;
  const cur = $('#f-ai-model')?.value;
  wrap.innerHTML = State.models.slice(0, 12).map(m => {
    const id = m.id || m.name;
    return `<button class="chip ${cur === id ? 'active' : ''}" data-chip="${esc(id)}">${esc(id)}</button>`;
  }).join('');
}

/* ============ History ============ */
async function pageHistory() {
  const h = await API.get('/api/config/history').catch(() => ({ fetchHistory: [], sendHistory: [] }));
  State.history = h;
  const row = (it, icon) => `<div class="list-item">
      <div class="li-av">${ic(icon)}</div>
      <div class="li-main">
        <div class="li-title">${esc(it.title || it.period || '任务记录')}</div>
        <div class="li-meta"><span>${esc(it.time ? new Date(it.time).toLocaleString('zh-CN') : '—')}</span></div>
      </div>
      <span class="badge ${it.status === 'failed' || it.error ? 'err' : 'ok'}">${esc(it.status || '完成')}</span>
    </div>`;

  const fetchList = h.fetchHistory?.length
    ? `<div class="card"><div class="list">${h.fetchHistory.map(x => row(x, 'inbox')).join('')}</div></div>`
    : `<div class="card">${emptyState('inbox', '暂无抓取记录', '执行一次抓取任务后，记录会显示在这里。')}</div>`;
  const sendList = h.sendHistory?.length
    ? `<div class="card"><div class="list">${h.sendHistory.map(x => row(x, 'outbox')).join('')}</div></div>`
    : `<div class="card">${emptyState('outbox', '暂无发送记录', '测试邮件或正式推送后，记录会显示在这里。')}</div>`;

  return pageHead('历史记录', '抓取与发送任务日志',
    `<button class="btn btn-danger btn-sm" data-act="clear-history">${ic('trash')}清空</button>`) +
    section('抓取历史', fetchList, 'inbox') + section('发送历史', sendList, 'outbox');
}

/* ============ Preview ============ */
const PERIODS = [['morning', '早报', 'sunrise'], ['noon', '午报', 'sun'], ['afternoon', '午后', 'sunset'], ['evening', '晚间', 'moon']];

async function pagePreview() {
  const cur = State.previewPeriod || 'morning';
  return pageHead('邮件预览', '选择时段生成 HTML 邮件效果') +
    section('时段选择', `<div class="card"><div class="card-bd">
      <div class="seg" id="periodSeg">
        ${PERIODS.map(([k, l, i]) => `<button class="${cur === k ? 'active' : ''}" data-period="${k}">${ic(i)}${l}</button>`).join('')}
      </div>
      <div class="mt-4"><button class="btn btn-primary btn-block" data-act="gen-preview">${ic('eye')}生成预览</button></div>
    </div></div>`, 'clock') +
    section('预览结果', `<div class="preview-shell" id="previewShell">
      ${emptyState('image', '尚未生成预览', '选择时段后点击「生成预览」查看邮件渲染效果。')}
    </div>`, 'doc');
}

const PERIOD_LABEL = { morning: '早报', noon: '午报', afternoon: '午后', evening: '晚间' };

function demoEmailHtml(period) {
  const label = PERIOD_LABEL[period] || '早报';
  const now = new Date();
  const date = `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日`;
  const items = [
    ['AI 前沿', 'cpu', '多模态大模型进入「实时交互」阶段', '新一轮模型竞赛聚焦低延迟推理与端侧部署，推理成本持续下探。'],
    ['硬件动态', 'monitor', '新一代 ARM 平台能效比再创新高', '移动端 NPU 算力提升明显，端侧 AI 应用场景进一步扩大。'],
    ['国际要闻', 'globe', '全球科技产业链加速区域化重构', '多地推进本地化产能建设，供应链韧性成为核心议题。'],
    ['财经速览', 'coin', '科技板块震荡上行，资金关注算力基建', '市场风险偏好回升，算力与数据中心相关标的受到关注。'],
  ];
  const svgIcon = (n) => `<svg width="13" height="13" viewBox="0 0 24 24" fill="#6366F1" style="vertical-align:-2px"><use href="#i-${n}"/></svg>`;
  return `<!DOCTYPE html><html><head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1"></head>
  <body style="margin:0;background:#f2f4f8;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;">
  <div style="max-width:640px;margin:0 auto;background:#fff;">
    <div style="background:linear-gradient(135deg,#6366F1,#8B5CF6 55%,#A855F7);padding:34px 28px;color:#fff;">
      <div style="font-size:12px;letter-spacing:3px;opacity:.85;">LUMAPOST · 光影邮报</div>
      <div style="font-size:26px;font-weight:800;margin-top:8px;letter-spacing:1px;">${label}</div>
      <div style="font-size:13px;opacity:.9;margin-top:6px;">${date} · 示例预览</div>
    </div>
    <div style="padding:22px 28px 8px;">
      <div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#9A3412;line-height:1.6;">
        这是<b>示例预览</b>：当前 data 目录还没有真实抓取数据。执行一次「立即抓取」后，这里会显示真实生成的邮件。
      </div>
    </div>
    <div style="padding:6px 28px 28px;">
      ${items.map(([tag, icon, title, desc]) => `
      <div style="border-bottom:1px solid #eceff5;padding:16px 0;">
        <div style="font-size:11.5px;font-weight:700;color:#6366F1;letter-spacing:.5px;">${svgIcon(icon)} ${tag}</div>
        <div style="font-size:16px;font-weight:700;color:#0f172a;margin:6px 0;line-height:1.45;">${title}</div>
        <div style="font-size:13px;color:#5A6780;line-height:1.7;">${desc}</div>
      </div>`).join('')}
      <div style="margin-top:22px;background:#F5F7FC;border-radius:14px;padding:16px 18px;">
        <div style="font-size:12px;font-weight:700;color:#0f172a;margin-bottom:6px;">${svgIcon('quote')} 今日一句</div>
        <div style="font-size:13px;color:#5A6780;line-height:1.7;font-style:italic;">「把复杂留给系统，把清晰留给读者。」</div>
      </div>
    </div>
    <div style="padding:18px 28px 26px;text-align:center;font-size:11px;color:#8A94A8;border-top:1px solid #eceff5;">
      LumaPost · 光影邮报 &nbsp;|&nbsp; AI 驱动的智能新闻邮件系统<br>本邮件由系统自动生成
    </div>
  </div></body></html>`;
}

async function genPreview() {
  const period = State.previewPeriod || 'morning';
  const shell = $('#previewShell');
  if (!shell) return;
  shell.innerHTML = `<div class="card-bd">${Array.from({ length: 6 }, () => '<div class="sk sk-line"></div>').join('')}</div>`;
  let html = null, demo = false;
  try {
    busy(true);
    const res = await fetch(`/api/preview/${period}`);
    const text = await res.text();
    busy(false);
    if (res.ok && text && !/^\s*\{/.test(text)) html = text;
    else demo = true;
  } catch {
    busy(false);
    demo = true;
  }
  if (!html) html = demoEmailHtml(period);
  shell.innerHTML = `<iframe class="preview-frame" id="previewFrame" title="邮件预览"></iframe>`;
  $('#previewFrame').srcdoc = html;
  toast(demo ? '暂无真实数据，已展示示例预览' : '预览已生成', demo ? 'info' : 'ok');
}

/* ============ Actions ============ */
async function doSave() {
  const cfg = collectConfig();
  try {
    busy(true);
    await API.post('/api/config', cfg);
    busy(false);
    State.config = { ...State.config, ...cfg };
    toast('配置已保存到本地', 'ok');
    buzz();
  } catch (e) { busy(false); toast('保存失败: ' + e.message, 'err'); }
}
async function doTestAI() {
  const cfg = collectConfig();
  if (!cfg.ai.apiKey) return toast('请先填写 API Key', 'err');
  try {
    busy(true);
    const res = await API.post('/api/test-ai', { message: '你好，请回复"连接成功"。' });
    busy(false);
    if (res.success) toast('AI 连接成功：' + String(res.message || '').slice(0, 34), 'ok');
    else toast(res.error || '连接失败', 'err');
  } catch (e) { busy(false); toast('连接失败: ' + e.message, 'err'); }
}
async function doTestMail() {
  const cfg = collectConfig();
  const to = cfg.mail.to || cfg.mail.user;
  if (!to) return toast('请先填写邮箱地址', 'err');
  try {
    busy(true);
    const res = await API.post('/api/test-mail', { to });
    busy(false);
    if (res.success) toast('测试邮件已发送至 ' + to, 'ok');
    else toast(res.error || '发送失败', 'err');
  } catch (e) { busy(false); toast('发送失败: ' + e.message, 'err'); }
}

function confirmModal(title, desc, onOk, okText = '确认', danger = false) {
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-hd"><div class="modal-title">${esc(title)}</div><div class="modal-desc">${esc(desc)}</div></div>
    <div class="modal-ft">
      <button class="btn btn-secondary" data-no>取消</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-yes>${esc(okText)}</button>
    </div></div>`;
  document.body.appendChild(mask);
  const close = () => mask.remove();
  mask.addEventListener('click', (e) => {
    if (e.target === mask || e.target.closest('[data-no]')) close();
    if (e.target.closest('[data-yes]')) { close(); onOk(); }
  });
}
async function doFetch() {
  confirmModal('立即抓取', '将对所有已启用时段执行新闻抓取并生成邮件，可能需要数分钟。', async () => {
    try {
      busy(true);
      const res = await API.post('/api/fetch', {});
      busy(false);
      if (res.success) { toast('抓取任务已启动', 'ok'); buzz(); } else toast(res.error || '启动失败', 'err');
    } catch (e) { busy(false); toast('启动失败: ' + e.message, 'err'); }
  }, '开始抓取');
}
async function doClearHistory() {
  confirmModal('清空历史记录', '抓取与发送历史将被永久删除，不可恢复。', async () => {
    try {
      busy(true); await API.del('/api/config/history'); busy(false);
      toast('历史已清空', 'ok'); render();
    } catch (e) { busy(false); toast('清空失败: ' + e.message, 'err'); }
  }, '清空', true);
}

/* ============ Event binding (delegation) ============ */
function bind() {
  const view = $('#view');
  if (view.dataset.bound === '1') return;
  view.dataset.bound = '1';

  view.addEventListener('click', async (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav) return go(nav.dataset.nav);

    const act = e.target.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'nav') return go(act.dataset.to);
      if (a === 'reload') { toast('已刷新', 'info'); return render(); }
      if (a === 'fetch') return doFetch();
      if (a === 'save') return doSave();
      if (a === 'test-ai') return doTestAI();
      if (a === 'test-mail') return doTestMail();
      if (a === 'clear-history') return doClearHistory();
      if (a === 'gen-preview') return genPreview();
      if (a === 'eye') {
        const inp = $('#' + act.dataset.target);
        if (!inp) return;
        const show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        act.classList.toggle('on', show);
        act.innerHTML = ic(show ? 'eye-off' : 'eye');
        return;
      }
      if (a === 'loadmodels') {
        const p = $('#f-ai-provider')?.value;
        if (!p) return toast('请先选择提供商', 'err');
        const box = $('#modelChips');
        if (box) box.innerHTML = '<div class="sk sk-line" style="width:120px"></div>';
        try {
          busy(true);
          const res = await API.get('/api/models/' + encodeURIComponent(p));
          busy(false);
          State.models = res.models || [];
          if (!State.models.length) { toast('该提供商无模型列表', 'warn'); if (box) box.innerHTML = ''; return; }
          renderModelChips();
          toast(`已获取 ${State.models.length} 个模型`, 'ok');
        } catch (err) { busy(false); toast('拉取失败: ' + err.message, 'err'); if (box) box.innerHTML = ''; }
        return;
      }
    }

    const chip = e.target.closest('[data-chip]');
    if (chip) {
      const inp = $('#f-ai-model');
      if (inp) inp.value = chip.dataset.chip;
      $$('#modelChips .chip').forEach(c => c.classList.toggle('active', c === chip));
      buzz();
      return;
    }

    const pick = e.target.closest('[data-pick]');
    if (pick) {
      const key = pick.dataset.pick;
      $$('.provider').forEach(p => p.classList.toggle('active', p === pick));
      State.config.ai = { ...(State.config.ai || {}), provider: key };
      busy(true);
      try { await API.post('/api/config', { ai: State.config.ai }); } catch {}
      busy(false);
      buzz();
      loadModels(key);
      return;
    }

    const model = e.target.closest('[data-model]');
    if (model) {
      const id = model.dataset.model;
      $$('#modelBox .list-item').forEach(el => el.classList.toggle('selected', el === model));
      State.config.ai = { ...(State.config.ai || {}), model: id };
      try { await API.post('/api/config', { ai: State.config.ai }); } catch {}
      toast('已选择模型：' + id, 'ok');
      buzz();
      return;
    }

    const per = e.target.closest('[data-period]');
    if (per) {
      State.previewPeriod = per.dataset.period;
      $$('#periodSeg button').forEach(b => b.classList.toggle('active', b === per));
      return;
    }
  });

  view.addEventListener('input', (e) => {
    if (e.target.id === 'f-ai-temp') {
      const el = $('#tempVal');
      if (el) el.textContent = e.target.value;
    }
  });

  view.addEventListener('change', (e) => {
    if (e.target.id === 'f-ai-provider') {
      const chips = $('#modelChips');
      if (chips) chips.innerHTML = '';
      State.models = [];
    }
  });
}

/* ============ Outer shell (sidebar / topbar) ============ */
document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { go(nav.dataset.nav); return; }
  const act = e.target.closest('[data-act]');
  if (act && !$('#view').contains(act)) {
    if (act.dataset.act === 'fetch') doFetch();
    if (act.dataset.act === 'reload') render();
  }
});

/* ============ Boot ============ */
(async function boot() {
  renderNav();
  try {
    State.config = await API.get('/api/config');
  } catch (e) {
    toast('配置加载失败：' + e.message, 'err');
    State.config = {};
  }
  await render();
})();
</script>
