<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LumaPost · 光影邮报</title>
<style>
/* ============================================================
   LumaPost Design System v5 — Tokens / Reset / Layout
   ============================================================ */
:root{
  --brand-1:#6366F1; --brand-2:#8B5CF6; --brand-3:#22D3EE;
  --grad-brand:linear-gradient(135deg,#6366F1 0%,#8B5CF6 55%,#A855F7 100%);
  --grad-glow:linear-gradient(135deg,rgba(99,102,241,.22),rgba(168,85,247,.10));
  --brand-soft:rgba(99,102,241,.14);
  --brand-line:rgba(99,102,241,.32);
  --ok:#10B981;   --ok-soft:rgba(16,185,129,.14);
  --warn:#F59E0B; --warn-soft:rgba(245,158,11,.14);
  --err:#F43F5E;  --err-soft:rgba(244,63,94,.14);
  --info:#38BDF8; --info-soft:rgba(56,189,248,.14);
  --bg:#080B16;
  --surface:#111726; --surface-2:#182031; --surface-3:#1F2A3D; --input:#0C1220;
  --line:rgba(255,255,255,.075); --line-strong:rgba(255,255,255,.14);
  --text:#EEF2F9; --text-2:#A7B3C9; --text-3:#6B7893;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:26px; --r-full:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px; --s-10:40px;
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 4px 16px rgba(0,0,0,.34);
  --sh-3:0 12px 36px rgba(0,0,0,.42);
  --sh-brand:0 8px 26px rgba(99,102,241,.34);
  --ease:cubic-bezier(.32,.72,0,1);
  --fast:150ms; --mid:240ms; --slow:380ms;
  --sidebar-w:248px; --topbar-h:60px; --tabbar-h:64px; --maxw:1080px;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#F5F7FC; --surface:#FFFFFF; --surface-2:#F4F6FB; --surface-3:#EEF1F8; --input:#F2F5FA;
    --line:rgba(15,23,42,.08); --line-strong:rgba(15,23,42,.16);
    --text:#0D1424; --text-2:#5A6780; --text-3:#8A94A8;
    --brand-soft:rgba(79,70,229,.10); --brand-line:rgba(79,70,229,.26);
    --sh-1:0 1px 2px rgba(15,23,42,.06);
    --sh-2:0 6px 20px rgba(15,23,42,.08);
    --sh-3:0 16px 40px rgba(15,23,42,.12);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:-20% -10% auto -10%;height:66vh;z-index:-1;pointer-events:none;
  background:
    radial-gradient(46% 52% at 18% 8%,rgba(99,102,241,.17),transparent 70%),
    radial-gradient(42% 46% at 86% 0%,rgba(34,211,238,.10),transparent 68%);
  filter:blur(6px);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9px}
::selection{background:var(--brand-soft)}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100dvh}
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);z-index:40;
  display:flex;flex-direction:column;padding:var(--s-5) var(--s-3);
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  border-right:1px solid var(--line);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
}
.brand{display:flex;align-items:center;gap:var(--s-3);padding:0 var(--s-2) var(--s-5)}
.brand-logo{
  width:40px;height:40px;flex:0 0 40px;border-radius:13px;background:var(--grad-brand);
  display:grid;place-items:center;font-size:19px;box-shadow:var(--sh-brand);
}
.brand-name{font-size:15.5px;font-weight:760;letter-spacing:.2px;line-height:1.25}
.brand-sub{font-size:10.5px;color:var(--text-3);letter-spacing:.7px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;padding-bottom:var(--s-3)}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--text-3);padding:var(--s-3) var(--s-3) var(--s-2)}
.nav-item{
  display:flex;align-items:center;gap:var(--s-3);padding:10px var(--s-3);
  border-radius:var(--r-sm);color:var(--text-2);font-size:14px;font-weight:560;
  text-align:left;width:100%;position:relative;
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease),transform var(--fast) var(--ease);
}
.nav-item .ico{font-size:16px;width:20px;text-align:center;flex:0 0 20px}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item:active{transform:scale(.985)}
.nav-item.active{background:var(--brand-soft);color:var(--text);font-weight:660}
.nav-item.active::before{
  content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--grad-brand);
}
.sidebar-foot{padding:var(--s-3) var(--s-2) 0;border-top:1px solid var(--line)}
.sidebar-foot .btn{width:100%}

.topbar{
  display:none;position:sticky;top:0;z-index:35;height:var(--topbar-h);
  align-items:center;justify-content:space-between;gap:var(--s-3);padding:0 var(--s-4);
  background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid var(--line);
}
.topbar .brand{padding:0;gap:var(--s-2)}
.topbar .brand-logo{width:32px;height:32px;flex-basis:32px;border-radius:10px;font-size:16px}
.topbar .brand-name{font-size:14.5px}
.topbar-actions{display:flex;gap:var(--s-2)}
.icon-btn{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:16px;
  background:var(--surface-2);border:1px solid var(--line);
  transition:transform var(--fast) var(--ease),background var(--fast) var(--ease);
}
.icon-btn:active{transform:scale(.92);background:var(--surface-3)}

.main{flex:1;margin-left:var(--sidebar-w);padding:var(--s-6) var(--s-6) var(--s-10);width:100%;min-width:0}
.wrap{max-width:var(--maxw);margin:0 auto;width:100%}

.tabbar{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:38;
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(22px) saturate(170%);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  border-top:1px solid var(--line);
}
.tabbar-inner{display:flex;height:var(--tabbar-h)}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-3);font-size:10.5px;font-weight:620;position:relative;
  transition:color var(--fast) var(--ease);
}
.tab-item .ico{font-size:18px;transition:transform var(--mid) var(--ease)}
.tab-item:active .ico{transform:scale(.86)}
.tab-item.active{color:var(--brand-1)}
.tab-item.active::after{content:'';position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--grad-brand)}
@media (prefers-color-scheme:light){.tab-item.active{color:#4F46E5}}

/* ---------- Components (part 2) ---------- */
.loading-bar::after{content:'';position:absolute;inset:0;width:38%;background:var(--grad-brand);border-radius:9px;animation:barSlide 1.05s var(--ease) infinite}
@keyframes barSlide{0%{transform:translateX(-105%)}100%{transform:translateX(300%)}}

.modal-mask{position:fixed;inset:0;z-index:80;background:rgba(4,6,14,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:var(--s-5);animation:fadeIn var(--mid) var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:var(--sh-3);overflow:hidden;animation:modalIn var(--slow) var(--ease)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.modal-hd{padding:var(--s-5) var(--s-5) var(--s-2)}
.modal-title{font-size:16px;font-weight:760}
.modal-desc{font-size:12.5px;color:var(--text-3);margin-top:3px;line-height:1.5}
.modal-bd{padding:var(--s-4) var(--s-5)}
.modal-ft{display:flex;gap:var(--s-2);padding:var(--s-4) var(--s-5) var(--s-5)}
.modal-ft .btn{flex:1}

.preview-frame{width:100%;height:min(72vh,760px);border:0;background:#fff;border-radius:var(--r-md);display:block}
.preview-shell{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s-2);box-shadow:var(--sh-1)}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{height:32px;padding:0 14px;border-radius:9px;font-size:12.5px;font-weight:640;color:var(--text-2);transition:all var(--fast) var(--ease)}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:var(--sh-1)}
@media (prefers-color-scheme:light){.seg button.active{box-shadow:0 1px 3px rgba(15,23,42,.12)}}

.hero{
  position:relative;overflow:hidden;border-radius:var(--r-lg);
  padding:var(--s-6);margin-bottom:var(--s-5);
  background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--sh-2);
}
.hero::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(80% 130% at 100% 0%,rgba(139,92,246,.20),transparent 62%),
             radial-gradient(70% 120% at 0% 100%,rgba(34,211,238,.13),transparent 60%);
}
.hero-in{position:relative;display:flex;align-items:center;justify-content:space-between;gap:var(--s-5);flex-wrap:wrap}
.hero-title{font-size:22px;font-weight:820;letter-spacing:-.5px;line-height:1.3}
.hero-title .grad{background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:13px;color:var(--text-2);margin-top:6px;max-width:430px;line-height:1.6}
.hero-actions{display:flex;gap:var(--s-2);flex-wrap:wrap}
.hero-pulse{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;color:var(--ok);background:var(--ok-soft);padding:4px 10px;border-radius:var(--r-full);margin-bottom:var(--s-3)}
.hero-pulse i{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 1.8s ease-in-out infinite;display:block}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

.sticky-actions{
  position:sticky;bottom:0;z-index:20;
  display:flex;gap:var(--s-2);padding:var(--s-3) 0;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
}
.sticky-actions .btn{flex:1}

.divider{height:1px;background:var(--line);margin:var(--s-4) 0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.muted{color:var(--text-3)}
.mt-3{margin-top:var(--s-3)}
.mt-4{margin-top:var(--s-4)}
.hidden{display:none !important}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .main{margin-left:0;padding:0 var(--s-4) calc(var(--tabbar-h) + var(--s-6))}
  .sidebar{display:none}
  .topbar{display:flex}
  .tabbar{display:block}
  .page-title{font-size:21px}
  .hero{padding:var(--s-5);border-radius:var(--r-md)}
  .hero-title{font-size:19px}
  .stats{grid-template-columns:repeat(2,1fr);gap:var(--s-2)}
  .stat{padding:var(--s-3)}
  .stat-val{font-size:16.5px}
  .provider-grid{grid-template-columns:repeat(2,1fr);gap:var(--s-2)}
  .provider{padding:var(--s-3)}
  .form-row{grid-template-columns:1fr;gap:0}
  .toasts{left:var(--s-4);right:var(--s-4);bottom:calc(var(--tabbar-h) + var(--s-3) + env(safe-area-inset-bottom));max-width:none}
  .preview-frame{height:min(66vh,600px)}
  .hero-in{gap:var(--s-4)}
  .hero-actions{width:100%}
  .hero-actions .btn{flex:1}
}
@media (max-width:420px){
  .page-head{gap:var(--s-3)}
  .page-head-actions{width:100%}
  .page-head-actions .btn{flex:1}
  .btn{padding:0 var(--s-3)}
}

</style>
</head>
<body>
<div class="loading-bar" id="loadingBar"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">📰</div>
      <div>
        <div class="brand-name">LumaPost</div>
        <div class="brand-sub">光影邮报</div>
      </div>
    </div>
    <nav class="nav" id="sideNav"></nav>
    <div class="sidebar-foot">
      <button class="btn btn-primary" data-act="fetch">🚀 立即抓取</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">📰</div>
        <div><div class="brand-name">LumaPost</div></div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" data-act="fetch" title="立即抓取">🚀</button>
        <button class="icon-btn" data-act="reload" title="刷新">↻</button>
      </div>
    </header>
    <div class="wrap" id="view"></div>
  </div>
</div>

<nav class="tabbar"><div class="tabbar-inner" id="tabBar"></div></nav>
<div class="toasts" id="toasts"></div>

<script>
/* ===========================================================
   LumaPost Web UI v5 — App Logic
   =========================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '"', "'": '&#39;' }[c]));

const State = {
  page: 'dashboard',
  config: {},
  providers: [],
  models: [],
  modelsFor: null,
  history: { fetchHistory: [], sendHistory: [] },
  dirty: false,
  loading: 0,
};

const API = {
  async req(path, opt = {}) {
    const res = await fetch(path, {
      headers: opt.body ? { 'Content-Type': 'application/json' } : undefined,
      ...opt,
    });
    const text = await res.text();
    let data;
    try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
    if (!res.ok) throw new Error(data.error || data.message || `HTTP ${res.status}`);
    return data;
  },
  get: (p) => API.req(p),
  post: (p, b) => API.req(p, { method: 'POST', body: JSON.stringify(b ?? {}) }),
  del: (p) => API.req(p, { method: 'DELETE' }),
};

/* ---------- Feedback ---------- */
const ICONS = { ok: '✓', err: '✕', info: 'i', warn: '!' };
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="ico">${ICONS[type] || ICONS.info}</span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  const t = setTimeout(dismiss, 3200);
  function dismiss() { clearTimeout(t); el.classList.add('out'); setTimeout(() => el.remove(), 260); }
  el.addEventListener('click', dismiss);
}
function busy(on) {
  State.loading = Math.max(0, State.loading + (on ? 1 : -1));
  $('#loadingBar').classList.toggle('on', State.loading > 0);
}
const buzz = () => { try { navigator.vibrate?.(8); } catch {} };

function skeleton(rows = 3) {
  return `<div class="card card-bd">${Array.from({ length: rows }, (_, i) =>
    `<div class="sk sk-line ${i % 2 ? 'w60' : ''}"></div>`).join('')}</div>`;
}
function emptyState(ico, title, desc, actionHtml = '') {
  return `<div class="empty">
    <div class="empty-ico">${ico}</div>
    <div class="empty-title">${esc(title)}</div>
    <div class="empty-desc">${esc(desc)}</div>
    ${actionHtml ? `<div class="mt-3">${actionHtml}</div>` : ''}
  </div>`;
}

/* ---------- Navigation ---------- */
const NAV = [
  { key: 'dashboard', label: '仪表盘', icon: '📊' },
  { key: 'config', label: '配置', icon: '⚙️' },
  { key: 'providers', label: '提供商', icon: '🤖' },
  { key: 'history', label: '历史', icon: '🕘' },
  { key: 'preview', label: '预览', icon: '👁️' },
];

function renderNav() {
  $('#sideNav').innerHTML = `<div class="nav-label">主页</div>` +
    NAV.map(n => `<button class="nav-item ${State.page === n.key ? 'active' : ''}" data-nav="${n.key}">
      <span class="ico">${n.icon}</span><span>${n.label}</span></button>`).join('');
  $('#tabBar').innerHTML = NAV.map(n => `<button class="tab-item ${State.page === n.key ? 'active' : ''}" data-nav="${n.key}">
      <span class="ico">${n.icon}</span><span>${n.label}</span></button>`).join('');
}

function go(page) {
  if (State.page === page) return;
  State.page = page;
  renderNav();
  render();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

/* ---------- Router ---------- */
async function render() {
  const view = $('#view');
  view.innerHTML = skeleton(4);
  const fn = { dashboard: pageDashboard, config: pageConfig, providers: pageProviders, history: pageHistory, preview: pagePreview }[State.page];
  try {
    view.innerHTML = await fn();
    bind();
  } catch (e) {
    view.innerHTML = `<div class="card card-bd">${emptyState('⚠️', '加载失败', e.message,
      `<button class="btn btn-secondary btn-sm" data-act="reload">重试</button>`)}</div>`;
    bind();
    toast('加载失败: ' + e.message, 'err');
  }
}

/* ---------- Page helpers ---------- */
function pageHead(title, desc, actions = '') {
  return `<div class="page-head">
    <div><div class="page-title">${esc(title)}</div><div class="page-desc">${esc(desc)}</div></div>
    ${actions ? `<div class="page-head-actions">${actions}</div>` : ''}
  </div>`;
}
function section(title, body, icon = '', right = '') {
  return `<div class="section">
    <div class="section-head">
      <div class="section-title">${icon ? `<span class="ico">${icon}</span>` : ''}${esc(title)}</div>
      ${right}
    </div>${body}</div>`;
}

/* ============ Dashboard ============ */
async function pageDashboard() {
  const [val, news] = await Promise.all([
    API.get('/api/config/validate').catch(() => ({ valid: false, errors: ['无法校验'] })),
    API.get('/api/news/latest').catch(() => ({ headline: [] })),
  ]);
  const c = State.config;
  const enabled = c.sections?.enabled?.length || 0;
  const headlines = news.headline || [];
  const stat = (ico, cls, val, label) =>
    `<div class="stat"><div class="stat-ico ${cls}">${ico}</div>
      <div class="stat-val">${esc(val)}</div><div class="stat-label">${esc(label)}</div></div>`;

  const hero = `<div class="hero"><div class="hero-in">
    <div>
      <div class="hero-pulse"><i></i>${val.valid ? '系统运行正常' : '配置待完善'}</div>
      <div class="hero-title">你好，欢迎回到 <span class="grad">LumaPost</span></div>
      <div class="hero-sub">AI 驱动的智能新闻邮件系统 · 每日 4 次自动推送 · 多提供商自由切换</div>
    </div>
    <div class="hero-actions">
      <button class="btn btn-primary btn-lg" data-act="fetch">🚀 立即抓取</button>
      <button class="btn btn-secondary btn-lg" data-act="nav" data-to="preview">👁️ 预览邮件</button>
    </div>
  </div></div>`;

  const banner = val.valid
    ? `<div class="banner ok"><div class="banner-ico">✅</div><div>
        <div class="banner-title">配置完整可用</div>
        <div class="banner-desc">AI 与邮件服务均已配置，可以正常执行抓取与发送任务。</div></div></div>`
    : `<div class="banner warn"><div class="banner-ico">⚠️</div><div>
        <div class="banner-title">配置不完整</div>
        <div class="banner-desc">${esc((val.errors || []).join(' · ') || '请前往配置页面补全信息')}</div>
        <div class="mt-3"><button class="btn btn-sm btn-secondary" data-act="nav" data-to="config">前往配置 →</button></div></div></div>`;

  const newsList = headlines.length

function confirmModal(title, desc, onOk, okText = '确认', danger = false) {
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `<div class="modal">
    <div class="modal-hd"><div class="modal-title">${esc(title)}</div><div class="modal-desc">${esc(desc)}</div></div>
    <div class="modal-ft">
      <button class="btn btn-secondary" data-no>取消</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-yes>${esc(okText)}</button>
    </div></div>`;
  document.body.appendChild(mask);
  const close = () => mask.remove();
  mask.addEventListener('click', (e) => {
    if (e.target === mask || e.target.closest('[data-no]')) close();
    if (e.target.closest('[data-yes]')) { close(); onOk(); }
  });
}

/* ============ Event binding (delegation) ============ */
function bind() {
  const view = $('#view');
  if (view.dataset.bound === '1') return;
  view.dataset.bound = '1';
  view.addEventListener('click', async (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav) return go(nav.dataset.nav);
    const act = e.target.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'nav') return go(act.dataset.to);
      if (a === 'reload') { toast('已刷新', 'info'); return render(); }
      if (a === 'fetch') return doFetch();
      if (a === 'save') return doSave();
      if (a === 'test-ai') return doTestAI();
      if (a === 'test-mail') return doTestMail();
      if (a === 'clear-history') return doClearHistory();
      if (a === 'gen-preview') return genPreview();
      if (a === 'eye') {
        const inp = $('#' + act.dataset.target);
        if (inp) { inp.type = inp.type === 'password' ? 'text' : 'password'; act.style.color = inp.type === 'text' ? 'var(--brand-1)' : ''; }
        return;
      }
      if (a === 'loadmodels') {
        const p = $('#f-ai-provider')?.value;
        if (!p) return toast('请先选择提供商', 'err');
        const box = $('#modelChips');
        if (box) box.innerHTML = '<div class="sk sk-line" style="width:120px"></div>';
        try {
          busy(true);
          const res = await API.get('/api/models/' + encodeURIComponent(p));
          busy(false);
          State.models = res.models || [];
          if (!State.models.length) { toast('该提供商无模型列表', 'warn'); if (box) box.innerHTML = ''; return; }
          renderModelChips();
          toast(`已获取 ${State.models.length} 个模型`, 'ok');
        } catch (err) { busy(false); toast('拉取失败: ' + err.message, 'err'); if (box) box.innerHTML = ''; }
        return;
      }
    }
    const chip = e.target.closest('[data-chip]');
    if (chip) {
      const inp = $('#f-ai-model');
      if (inp) inp.value = chip.dataset.chip;
      $$('#modelChips .chip').forEach(c => c.classList.toggle('active', c === chip));
      buzz();
      return;
    }
    const pick = e.target.closest('[data-pick]');
    if (pick) {
      const key = pick.dataset.pick;
      $$('.provider').forEach(p => p.classList.toggle('active', p === pick));
      State.config.ai = { ...(State.config.ai || {}), provider: key };
      busy(true);
      try { await API.post('/api/config', { ai: State.config.ai }); } catch {}
      busy(false);
      buzz();
      loadModels(key);
      return;
    }
    const model = e.target.closest('[data-model]');
    if (model) {
      const id = model.dataset.model;
      $$('#modelBox .list-item').forEach(el => el.classList.toggle('selected', el === model));
      State.config.ai = { ...(State.config.ai || {}), model: id };
      try { await API.post('/api/config', { ai: State.config.ai }); } catch {}
      toast('已选择模型：' + id, 'ok');
      buzz();
      return;
    }
    const per = e.target.closest('[data-period]');
    if (per) {
      State.previewPeriod = per.dataset.period;
      $$('#periodSeg button').forEach(b => b.classList.toggle('active', b === per));
      return;
    }
  });

  view.addEventListener('input', (e) => {
    if (e.target.id === 'f-ai-temp') {
      const el = $('#tempVal');
      if (el) el.textContent = e.target.value;
    }
  });

  view.addEventListener('change', (e) => {
    if (e.target.id === 'f-ai-provider') {
      const chips = $('#modelChips');
      if (chips) chips.innerHTML = '';
      State.models = [];
    }
  });
}

/* ============ Boot ============ */
document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav) go(nav.dataset.nav);
  const act = e.target.closest('[data-act]');
  if (act && !$('#view').contains(act)) {
    if (act.dataset.act === 'fetch') doFetch();
    if (act.dataset.act === 'reload') render();
  }
});

(async function boot() {
  renderNav();
  try {
    State.config = await API.get('/api/config');
  } catch (e) {
    toast('配置加载失败：' + e.message, 'err');
    State.config = {};
  }
  await render();
  window.addEventListener('beforeunload', (e) => {
    if (State.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
})();

</script>
</body>
</html>
